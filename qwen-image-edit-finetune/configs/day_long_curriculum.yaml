# Day-Long Training Configuration
# Optimized for 24-hour training run

# Base paths and interpolation
base_data_path: "data/example_image_dataset"
output_base: "./models/curriculum"

# Dataset Configuration
dataset:
  base_path: ${base_data_path}
  metadata_path: null
  max_pixels: 1048576
  height: null
  width: null
  data_file_keys: "image,edit_image"
  repeat: 1
  num_workers: 8

# Model Configuration
model:
  paths: null
  id_with_origin_paths: "Qwen/Qwen-Image-Edit:transformer/diffusion_pytorch_model*.safetensors,Qwen/Qwen-Image:text_encoder/model*.safetensors,Qwen/Qwen-Image:vae/diffusion_pytorch_model.safetensors"
  tokenizer_path: null
  processor_path: null
  trainable_models: "dit"

# LoRA Configuration
lora:
  base_model: "dit"
  target_modules: "to_q,to_k,to_v,add_q_proj,add_k_proj,add_v_proj,to_out.0,to_add_out,img_mlp.net.2,img_mod.1,txt_mlp.net.2,txt_mod.1"
  rank: 16
  checkpoint: null

# Training Configuration - Optimized for day-long run
training:
  learning_rate: 8e-5  # Slightly higher for faster convergence
  num_epochs: 300      # More epochs for longer training
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  find_unused_parameters: true
  enable_fp8_training: false
  task: "sft"
  extra_inputs: "edit_image"

# Output Configuration
output:
  path: "${output_base}/Qwen-Image-Edit_day_long_lora_rank${lora.rank}_lr${training.learning_rate}"
  remove_prefix_in_ckpt: "pipe.dit."
  save_steps: 3000  # Save every 3000 steps (less frequent)

# Curriculum Learning Configuration - 4 phases, 6 hours each
curriculum:
  ranking_csv: "data/edit_ranking_out/ranking_dinov2_vitb14_tiers4.csv"
  schedule: "75:1.0,0.0,0.0,0.0;75:0.8,0.2,0.0,0.0;75:0.7,0.2,0.1,0.0;75:0.6,0.2,0.1,0.1"
  batch_size: 8
  steps_per_epoch: 1000
  sort_within_tier: false
  seed: 42
  max_epochs_per_phase: 30  # 30 epochs = 6 hours per phase

# Early Stopping Configuration - More patient for long training
early_stopping:
  patience: 8   # More patient for curriculum phases
  threshold: 0.0005  # Smaller threshold for fine improvements

# Validation Configuration - Less frequent for efficiency
validation:
  csv_path: "${base_data_path}/validation.csv"
  steps: 2000  # Every 2000 steps (every 2 epochs)
  patience: 5   # More patient
  min_delta: 0.0005
  batch_size: 4
  samples: 20   # More validation samples for better metrics

# Environment specific overrides
defaults:
  - _self_