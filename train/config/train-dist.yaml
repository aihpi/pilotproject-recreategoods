data:
  batch_size: 9
  val_batch_size: 16
  num_workers: 8
  data_dir: "/workspace/dataset/p2p-dataset-filtered"
  # data_dir: "/home/felix.boelter/recreategoods/train/dataset/p2p-dataset-filtered"
  resize_res: [512, 512]
model:
  name: "shuttleai/shuttle-3.1-aesthetic"
  dtype: "bfloat16"
  learning_rate: 1e-3
  weight_decay: 1e-4
  max_epochs: 1000
  l2sp_weight: 1e-4
  scheduler:
    step_size: 10
    gamma: 0.1

training:
  num_nodes: 2
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 4
  precision: "bf16-mixed"
  wandb_run_name: "FLUX-Full-Training-Dist-OnlyImage-Reversenew"