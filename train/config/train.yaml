data:
  batch_size: 8
  num_workers: 16
  data_dir: "/home/felix.boelter/recreategoods/dataset_generation/data/split-data"
  min_resize_res: 256
  max_resize_res: 256
  crop_res: 512
  flip_prob: 0.5

model:
  name: "shuttleai/shuttle-3.1-aesthetic"
  dtype: "bfloat16"
  learning_rate: 1e-6
  weight_decay: 1e-4
  max_epochs: 20
  scheduler:
    step_size: 10
    gamma: 0.1
  

training:
  gpus: 1
  precision: "bf16"