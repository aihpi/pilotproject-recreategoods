data:
  batch_size: 8
  val_batch_size: 8
  num_workers: 8
  data_dir: "/home/felix.boelter/recreategoods/dataset_generation/data/split-data"
  resize_res: [512, 512]
model:
  name: "shuttleai/shuttle-3.1-aesthetic"
  dtype: "bfloat16"
  learning_rate: 1e-4
  weight_decay: 1e-4
  max_epochs: 20
  scheduler:
    step_size: 10
    gamma: 0.1
  

training:
  gpus: 1
  num_nodes: 1
  val_check_interval: 50
  accumulate_grad_batches: 8
  precision: "bf16-mixed"