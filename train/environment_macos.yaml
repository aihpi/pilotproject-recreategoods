name: train-model
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Core dependencies
  - python=3.10
  - pip
  - numpy
  - scipy
  - matplotlib
  - pandas
  - tqdm
  
  # PyTorch dependencies for macOS (uses MPS acceleration on Apple Silicon)
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  
  # Deep learning libraries
  - scikit-learn
  - tensorboard
  
  # Development tools
  - jupyter
  - ipykernel
  - black
  - flake8
  
  # Additional packages via pip
  - pip:
    - transformers
    - diffusers
    - accelerate
    - wandb
    - pytorch-lightning
    - py-cpuinfo
    - deepspeed
    - lpips
    - peft
    - einops
    - omegaconf
    - safetensors
    - datasets 