name: train-model
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core dependencies for all platforms
  - python=3.10
  - pip
  - numpy
  - scipy
  - matplotlib
  - pandas
  - tqdm
  - sentencepiece
  
  # PyTorch dependencies - platform specific
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  
  # CUDA dependencies - only for Linux/Windows
  - pytorch-cuda=12.1  # [linux or win]
  
  # Deep learning libraries
  - scikit-learn
  - tensorboard
  
  # Development tools
  - jupyter
  - ipykernel
  - black
  - flake8
  
  # Additional packages via pip
  - pip:
    - transformers
    - diffusers
    - accelerate
    - wandb
    - pytorch-lightning
    - py-cpuinfo
    - deepspeed
    - lpips
    - peft
    - einops
    - omegaconf
    - safetensors
    - datasets 