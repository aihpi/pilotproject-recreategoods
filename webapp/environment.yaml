name: webapp
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - streamlit>=1.31.0
  - pillow>=10.0.0
  - pytorch>=2.5.1
  - pytorch-cuda=12.1
  - torchvision
  - numpy
  - einops
  - fire
  - jpeg
  - pip
  - pip:
    - streamlit-scroll-to-top
    - transformers[torch,sentencepiece]>=4.31.0
    - safetensors
    - invisible-watermark
    - sentencepiece
    - accelerate
    - diffusers
    - -e ../pix2pix/flux 